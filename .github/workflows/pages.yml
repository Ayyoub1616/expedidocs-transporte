name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare self-hosted app and spreadsheet/PDF libraries
        run: |
          set -euo pipefail
          mkdir -p site/vendor
          cp index.html app.js quick.js sync.js cmr-exact.js cmr-pdf.js styles.css manifest.webmanifest cmr_exact_template.b64 cmr_pdf_background.b64 site/
          curl --retry 3 --fail --location --silent --show-error 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js' -o site/vendor/supabase.min.js
          curl --retry 3 --fail --location --silent --show-error 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js' -o site/vendor/jszip.min.js
          curl --retry 3 --fail --location --silent --show-error 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js' -o site/vendor/pdf-lib.min.js
          test -s site/vendor/supabase.min.js
          test -s site/vendor/jszip.min.js
          test -s site/vendor/pdf-lib.min.js
      - name: Verify generator source and original template assets
        run: |
          set -euo pipefail
          for file in app.js quick.js sync.js cmr-exact.js cmr-pdf.js; do node --check "$file"; done
          python3 -c 'import base64,zipfile,io; b=base64.b64decode(open("cmr_exact_template.b64").read()); z=zipfile.ZipFile(io.BytesIO(b)); assert z.testzip() is None; assert all("xl/worksheets/sheet%d.xml"%i in z.namelist() for i in range(1,5)); assert "xl/media/image1.png" in z.namelist(); print("Exact CMR XLSX: four worksheets and original stamp OK")'
          python3 -c 'import base64; p=base64.b64decode(open("cmr_pdf_background.b64").read()); assert p.startswith(b"%PDF-"); print("PDF template header OK")'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
